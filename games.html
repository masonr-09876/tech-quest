<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games | Tech Quest</title>
  <meta name="description" content="Free browser games made by Tech Quest. Play The Roomba Revolution, Drone Dash and more." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="games">
  <header class="site-header" id="site-header"></header>

  <main class="page-main">
    <section class="section">
      <div class="container">
        <div class="page-head">
          <p class="eyebrow">Tech Quest Games</p>
          <h1>Our games</h1>
          <p class="muted">Original games built by Tech Quest. Free to play right in your browser, no download needed.</p>
        </div>

        <div class="game-grid" id="game-grid"></div>

        <div class="empty-panel big" id="empty-games" hidden>
          <img src="assets/logo.svg" alt="" width="64" height="64" />
          <h3>First game coming soon</h3>
          <p>We're working on our first games right now. Check the Links page to get updates when they drop.</p>
          <a href="links.html" class="btn btn-small btn-accent" id="games-follow">Get updates</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
